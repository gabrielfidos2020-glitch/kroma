<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#170a20">
  <title>KROMA — pulso de cor</title>
  <style>
    :root{--violet:#170a20;--purple:#321044;--green:#40e45f;--paper:#f5f1e8}
    *{box-sizing:border-box}
    body{margin:0;background:var(--violet);color:#f5f0f7;font-family:Inter,"Segoe UI",Arial,sans-serif}
    main{width:min(920px,calc(100% - 36px));margin:auto;padding:52px 0 42px}
    .eyebrow{margin:0 0 9px;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(30px,5vw,48px);line-height:1;letter-spacing:-.05em}
    .intro{max-width:590px;color:#c6bacb;font-size:14px;line-height:1.65;margin:16px 0 25px}
    .artboard{position:relative;overflow:hidden;border:1px solid rgba(245,240,247,.18);border-radius:12px;background-color:var(--paper);background-image:linear-gradient(45deg,#e5ded2 25%,transparent 25%),linear-gradient(-45deg,#e5ded2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5ded2 75%),linear-gradient(-45deg,transparent 75%,#e5ded2 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
    canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:18px}
    .controls p{margin:0;color:#bfb3c4;font-size:12px;line-height:1.6}
    button{flex:none;border:1px solid var(--green);border-radius:6px;padding:12px 16px;background:var(--green);color:#102016;font:800 13px/1.2 Inter,"Segoe UI",Arial,sans-serif;cursor:pointer;transition:background .2s,transform .2s}
    button:hover{background:#72f287;transform:translateY(-1px)}
    button:disabled{opacity:.65;cursor:wait;transform:none}
    #status{min-height:18px;margin:9px 0 0;color:#bfb3c4;font-size:12px}
    @media(max-width:600px){main{padding-top:34px}.controls{align-items:flex-start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Kroma · vinheta 01</p>
    <h1>Pulso de cor</h1>
    <p class="intro">O símbolo entra em verde. Um pulso luminoso percorre a forma e deixa o roxo profundo no caminho. O tabuleiro claro mostra as áreas transparentes.</p>
    <div class="artboard"><canvas id="preview" width="960" height="540" aria-label="Prévia animada do símbolo Kroma"></canvas></div>
    <div class="controls">
      <p>WebM · 1920 × 1080 · 30 fps · fundo transparente<br>Duração: 2,8 s · sem texto</p>
      <button id="download" type="button" disabled>Preparando prévia…</button>
    </div>
    <p id="status" aria-live="polite"></p>
  </main>
  <script>
    const OUTPUT_W = 1920;
    const OUTPUT_H = 1080;
    const DURATION = 2.8;
    const GREEN = '#40e45f';
    const PURPLE = '#321044';
    const source = new Image();
    const preview = document.querySelector('#preview');
    const previewCtx = preview.getContext('2d');
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = OUTPUT_W;
    exportCanvas.height = OUTPUT_H;
    const exportCtx = exportCanvas.getContext('2d');
    const layer = document.createElement('canvas');
    layer.width = OUTPUT_W;
    layer.height = OUTPUT_H;
    const layerCtx = layer.getContext('2d');
    let maskCanvas;
    let maskW;
    let maskH;
    let ready = false;

    function ease(t){ return 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3); }
    function drawLayer(ctx, color, x, y, w, h, clipLeft = -Infinity, clipRight = Infinity){
      layerCtx.clearRect(0, 0, OUTPUT_W, OUTPUT_H);
      layerCtx.save();
      layerCtx.beginPath();
      layerCtx.rect(Math.max(0, clipLeft), 0, Math.max(0, Math.min(OUTPUT_W, clipRight) - Math.max(0, clipLeft)), OUTPUT_H);
      layerCtx.clip();
      layerCtx.fillStyle = color;
      layerCtx.fillRect(x, y, w, h);
      layerCtx.globalCompositeOperation = 'destination-in';
      layerCtx.drawImage(maskCanvas, x, y, w, h);
      layerCtx.restore();
      ctx.drawImage(layer, 0, 0);
    }
    function render(ctx, width, height, elapsed){
      if (!ready) return;
      ctx.clearRect(0, 0, width, height);
      const scale = Math.min(width * .46 / maskW, height * .72 / maskH);
      const markW = maskW * scale;
      const markH = maskH * scale;
      const x = (width - markW) / 2;
      const y = (height - markH) / 2;
      const enter = ease(elapsed / .24);
      const pulse = ease((elapsed - .28) / 1.48);
      const front = x + markW * pulse;
      const edgeWidth = Math.max(20, markW * .035);
      ctx.save();
      ctx.globalAlpha = enter;
      ctx.translate(width / 2, height / 2);
      const scaleIn = .94 + .06 * enter;
      ctx.scale(scaleIn, scaleIn);
      ctx.translate(-width / 2, -height / 2);
      drawLayer(ctx, GREEN, x, y, markW, markH);
      if (elapsed > .28) {
        drawLayer(ctx, PURPLE, x, y, markW, markH, 0, front);
        if (pulse < 1) {
          const edgeX = front - edgeWidth * .55;
          layerCtx.clearRect(0, 0, OUTPUT_W, OUTPUT_H);
          const glow = layerCtx.createLinearGradient(edgeX - edgeWidth, 0, edgeX + edgeWidth, 0);
          glow.addColorStop(0, 'rgba(64,228,95,0)');
          glow.addColorStop(.48, 'rgba(103,255,128,.82)');
          glow.addColorStop(.62, 'rgba(225,255,225,.96)');
          glow.addColorStop(1, 'rgba(64,228,95,0)');
          layerCtx.fillStyle = glow;
          layerCtx.fillRect(edgeX - edgeWidth, y, edgeWidth * 2, markH);
          layerCtx.globalCompositeOperation = 'destination-in';
          layerCtx.drawImage(maskCanvas, x, y, markW, markH);
          layerCtx.globalCompositeOperation = 'source-over';
          ctx.drawImage(layer, 0, 0);
        }
      }
      ctx.restore();
    }
    function animatePreview(now){
      render(previewCtx, preview.width, preview.height, (now % (DURATION * 1000)) / 1000);
      requestAnimationFrame(animatePreview);
    }
    function prepareMask(){
      maskW = source.naturalWidth;
      maskH = source.naturalHeight;
      const maskCtx = document.createElement('canvas').getContext('2d');
      maskCtx.canvas.width = maskW;
      maskCtx.canvas.height = maskH;
      maskCtx.drawImage(source, 0, 0);
      const image = maskCtx.getImageData(0, 0, maskW, maskH);
      const px = image.data;
      for (let i = 0; i < px.length; i += 4) {
        const alpha = Math.max(0, Math.min(255, Math.round((px[i + 1] - 24) * 1.9)));
        px[i] = 255; px[i + 1] = 255; px[i + 2] = 255; px[i + 3] = alpha;
      }
      maskCtx.putImageData(image, 0, 0);
      maskCanvas = maskCtx.canvas;
      ready = true;
      document.querySelector('#download').disabled = false;
      document.querySelector('#download').textContent = 'Baixar WebM transparente';
      requestAnimationFrame(animatePreview);
    }
    source.onload = prepareMask;
    source.src = '../../assets/brand/kroma-simbolo.png';

    document.querySelector('#download').addEventListener('click', () => {
      const button = document.querySelector('#download');
      const status = document.querySelector('#status');
      if (!window.MediaRecorder || !exportCanvas.captureStream) {
        status.textContent = 'Este navegador não oferece gravação WebM pelo canvas.';
        return;
      }
      const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
      const mimeType = types.find(type => MediaRecorder.isTypeSupported(type));
      if (!mimeType) {
        status.textContent = 'Este navegador não encontrou um codificador WebM compatível.';
        return;
      }
      button.disabled = true;
      button.textContent = 'Renderizando…';
      status.textContent = 'Renderizando a vinheta em 1920 × 1080…';
      const stream = exportCanvas.captureStream(30);
      const recorder = new MediaRecorder(stream, {mimeType, videoBitsPerSecond: 8000000});
      const chunks = [];
      recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
      recorder.onerror = () => {
        status.textContent = 'Não foi possível renderizar o WebM neste navegador.';
        button.disabled = false;
        button.textContent = 'Tentar novamente';
        stream.getTracks().forEach(track => track.stop());
      };
      recorder.onstop = async () => {
        const blob = new Blob(chunks, {type:mimeType});
        stream.getTracks().forEach(track => track.stop());
        button.disabled = false;
        button.textContent = 'Baixar WebM transparente';
        try {
          const saved = await fetch('http://localhost:8001/save', {method:'POST', headers:{'Content-Type':'video/webm'}, body:blob});
          if (!saved.ok) throw new Error('save unavailable');
          status.textContent = `Arquivo salvo em ../../assets/brand/KROMA-pulso-de-cor-transparente.webm · ${(blob.size / 1024 / 1024).toFixed(1)} MB · ${mimeType}`;
        } catch {
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'KROMA-pulso-de-cor-transparente.webm';
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          status.textContent = `Baixando pelo navegador · ${(blob.size / 1024 / 1024).toFixed(1)} MB · ${mimeType}`;
        }
      };
      recorder.start(100);
      const started = performance.now();
      function capture(now){
        const elapsed = (now - started) / 1000;
        render(exportCtx, OUTPUT_W, OUTPUT_H, Math.min(elapsed, DURATION));
        if (elapsed >= DURATION) recorder.stop();
        else requestAnimationFrame(capture);
      }
      requestAnimationFrame(capture);
    });
  </script>
</body>
</html>
